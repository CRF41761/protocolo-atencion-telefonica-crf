<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atención telefónica - CRF La Granja</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <div>
      <h1>📞 Atención telefónica</h1>
      <p>Centro de Recuperación de Fauna "La Granja de El Saler"</p>
    </div>
    <button id="btn-reiniciar" class="btn-header" onclick="reiniciar()">
      ↻ Reiniciar
    </button>
  </header>

  <main class="app-container">

    <div class="progress-container">
      <div class="progress-info">
        <span id="progress-text">Inicio</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <section id="app" class="card"></section>

  </main>

  <footer>
    <p>Protocolo de atención telefónica · Versión 04/08/2026</p>
  </footer>

  <script src="app.js"></script>
</body>

</html>
